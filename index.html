<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>talon - by keystone</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Three.js & Vanta.js CDNs for Animated 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <style>
        :root {
            --bg-glass: rgba(18, 22, 36, 0.65);
            --border-glass: rgba(255, 255, 255, 0.1);
            --accent: #79aadb;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', Arial, sans-serif;
        }

        body {
            background: #0d0e15;
            min-height: 100vh;
            display: flex;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Fixed 3D Animated Vanta Background Canvas */
        #vanta-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Sidebar Glassmorphism */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 80px;
            height: 100vh;
            background: rgba(13, 15, 24, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 1000;
            border-right: 1px solid var(--border-glass);
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .sidebar-btn {
            background: rgba(89, 134, 218, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            text-align: center;
            min-height: 45px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(121, 170, 219, 0.5);
            color: #0d0e15;
        }

        .sidebar-btn.empty {
            opacity: 0.25;
            cursor: default;
        }

        .sidebar-btn.empty:hover {
            transform: none;
            background: rgba(89, 134, 218, 0.2);
            box-shadow: none;
            color: white;
        }

        .main-content {
            margin-left: 100px;
            flex: 1;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
            max-width: 900px;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        .sub-link {
            color: white;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: normal;
            font-size: 18px;
        }

        .sub-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .sub-link a:hover {
            text-decoration: underline;
        }

        .search-container {
            text-align: center;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #searchInput {
            padding: 14px 20px;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(121, 170, 219, 0.4);
        }

        #lolbutton {
            background: rgba(89, 134, 218, 0.25);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        #lolbutton:hover {
            background: var(--accent);
            color: #0d0e15;
        }

        .letter-section {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            margin-bottom: 30px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .letter-section.empty {
            opacity: 0.4;
        }

        .letter-header {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .empty-message {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 15px;
        }

        input[type="button"] {
            background: rgba(89, 134, 218, 0.25);
            border: 1px solid var(--border-glass);
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.25s ease;
            width: 100%;
            max-width: 650px;
            color: white;
            text-align: left;
        }

        input[type="button"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            background: var(--accent);
            color: #0d0e15;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 15px 5px;
            }
            .sidebar-btn {
                padding: 8px;
                font-size: 14px;
            }
            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>
<body>

    <!-- Dynamic Vanta Background Canvas -->
    <div id="vanta-canvas"></div>

    <!-- Alphabet Sidebar -->
    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <h1>talon</h1>
        
        <div class="sub-link">
            more links in 
            <a href="https://discord.gg/bdwZCvTdpA" target="_blank">the discord</a>
        </div>

        <div class="sub-link">
            Discord Server: 
            <a href="https://discord.gg/bdwZCvTdpA" target="_blank">https://discord.gg/bdwZCvTdpA</a>
        </div>

        <div class="search-container">
            <input type="text" placeholder="Search..." id="searchInput">
            <button id="lolbutton" onclick="const script = document.createElement('script');script.src = 'https://cdn.jsdelivr.net/npm/ugs-singlefiles@1.0.2/games.js';document.body.appendChild(script);">Click to load if it isn't loading</button>
        </div>
        
        <div id="sections-container"></div>
    </div>

    <!-- External Game Logic Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/ugs-singlefiles@1.0.2/searchbut.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ugs-singlefiles@1.0.2/games.js"></script>

    <!-- Interactive Background Initialization -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof VANTA !== 'undefined') {
                VANTA.NET({
                    el: "#vanta-canvas",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 1.00,
                    color: 0x79aadb,
                    backgroundColor: 0x0d0e15,
                    points: 10.00,
                    maxDistance: 20.00,
                    spacing: 16.00
                });
            }
        });
    </script>
</body>
</html>
